<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Deck Overlay</title>
    <!-- Google Fonts for overlay text -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&family=Lato:wght@300;400;700;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Oswald:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Nunito:wght@300;400;500;600;700;800;900&family=Ubuntu:wght@300;400;500;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --overlay-width: 1920px;
            --overlay-height: 1080px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow: hidden;
            width: var(--overlay-width);
            height: var(--overlay-height);
            margin: 0;
            padding: 0;
        }
        
        /* Animation Keyframes for Alert Text */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes slideInDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes flipInX {
            from { transform: perspective(400px) rotateX(90deg); opacity: 0; }
            to { transform: perspective(400px) rotateX(0deg); opacity: 1; }
        }
        
        @keyframes flipInY {
            from { transform: perspective(400px) rotateY(90deg); opacity: 0; }
            to { transform: perspective(400px) rotateY(0deg); opacity: 1; }
        }
        
        @keyframes rotateIn {
            from { transform: rotate(-200deg); opacity: 0; }
            to { transform: rotate(0deg); opacity: 1; }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        
        @keyframes wobble {
            0% { transform: translateX(0%); }
            15% { transform: translateX(-25%) rotate(-5deg); }
            30% { transform: translateX(20%) rotate(3deg); }
            45% { transform: translateX(-15%) rotate(-3deg); }
            60% { transform: translateX(10%) rotate(2deg); }
            75% { transform: translateX(-5%) rotate(-1deg); }
            100% { transform: translateX(0%); }
        }
        
        @keyframes rubberBand {
            0% { transform: scale(1); }
            30% { transform: scaleX(1.25) scaleY(0.75); }
            40% { transform: scaleX(0.75) scaleY(1.25); }
            50% { transform: scaleX(1.15) scaleY(0.85); }
            65% { transform: scaleX(0.95) scaleY(1.05); }
            75% { transform: scaleX(1.05) scaleY(0.95); }
            100% { transform: scale(1); }
        }
        
        @keyframes tada {
            0% { transform: scale(1) rotate(0deg); }
            10%, 20% { transform: scale(0.9) rotate(-3deg); }
            30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
            40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .overlay-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
            gap: 0;
            padding: 0;
        }

        /* Base text slot - completely transparent */
        .text-slot {
            display: none; /* hidden until alert is active */
            align-items: center;
            justify-content: center;
            position: relative;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
        }

        /* Active when text is present */
        .text-slot.active {
            display: flex;
        }

        /* Child items - no transitions to avoid conflicting with animations */
        .text-slot > * {
            opacity: 1;
        }

        /* Fade-out state */
        .text-slot.fade-out > * {
            opacity: 0;
        }

        
        /* Center media placeholder - completely hidden when empty */
        #center-media:empty::before {
            content: '';
            display: none;
        }

        @keyframes fadeOut {
            0% { 
                opacity: 1; 
                transform: scale(1);
            }
            100% { 
                opacity: 0; 
                transform: scale(0.95);
            }
        }

        #center-media {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; /* allows stacking text + images */
            align-items: center;
            justify-content: center;
            background: transparent; /* no gray box */
            border: none;
            box-shadow: none;
            pointer-events: none; /* prevents blocking clicks */
            z-index: 10;
            /* Constrain to center grid cell - prevents bleeding into text areas */
            max-width: 33.333%; /* 1/3 of overlay width (center column) */
            max-height: 33.333%; /* 1/3 of overlay height (center row) */
            width: 33.333%;
            height: 33.333%;
        }

        #center-media img,
        #center-media video,
        #center-media p {
            opacity: 1;
            background: transparent; /* makes sure text has no box */
            margin: 0;
            padding: 0;
            color: white; /* or any color you want visible */
            font-size: 3rem; /* increased from 2rem for better visibility */
            text-align: center;
        }

        #center-media img,
        #center-media video {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            object-fit: contain;
            /* Enhanced visibility for streaming */
            filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.6));
            border-radius: 8px;
        }

        /* Fade animation classes */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in;
        }

        /* Text slot positions */
        #text-top-left {
            grid-column: 1;
            grid-row: 1;
        }

        #text-top-center {
            grid-column: 2;
            grid-row: 1;
        }

        #text-top-right {
            grid-column: 3;
            grid-row: 1;
        }

        #text-mid-left {
            grid-column: 1;
            grid-row: 2;
        }

        #text-center {
            grid-column: 2;
            grid-row: 2;
            z-index: 20; /* Above center media */
        }

        /* Make center text slot completely transparent when empty */
        #text-center:empty {
            background: transparent;
            padding: 0;
            margin: 0;
            min-height: 0;
            height: 0;
            border: none;
            box-shadow: none;
        }

        #text-mid-right {
            grid-column: 3;
            grid-row: 2;
        }

        #text-bottom-left {
            grid-column: 1;
            grid-row: 3;
        }

        #text-bottom-center {
            grid-column: 2;
            grid-row: 3;
        }

        #text-bottom-right {
            grid-column: 3;
            grid-row: 3;
        }

        /* Debug info - made transparent */
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: transparent;
            color: transparent;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }

        /* Utility classes for text styling overrides */
        .text-large { font-size: 64px; }
        .text-small { font-size: 12px; }
        .text-bold { font-weight: bold; }
        .text-normal { font-weight: normal; }
        .text-red { color: #ff4444; }
        .text-green { color: #44ff44; }
        .text-blue { color: #4444ff; }
        .text-yellow { color: #ffff44; }
        .text-white { color: white; }
        .bg-red { background: rgba(255, 68, 68, 0.8); }
        .bg-green { background: rgba(68, 255, 68, 0.8); }
        .bg-blue { background: rgba(68, 68, 255, 0.8); }
        .bg-yellow { background: rgba(255, 255, 68, 0.8); }
    </style>
</head>
<body>
    <div class="overlay-container">
        <!-- 9 text slots with specific IDs -->
        <div id="text-top-left" class="text-slot" data-placeholder="Top Left"></div>
        <div id="text-top-center" class="text-slot" data-placeholder="Top Center"></div>
        <div id="text-top-right" class="text-slot" data-placeholder="Top Right"></div>
        <div id="text-mid-left" class="text-slot" data-placeholder="Mid Left"></div>
        <div id="text-center" class="text-slot" data-placeholder="Center"></div>
        <div id="text-mid-right" class="text-slot" data-placeholder="Mid Right"></div>
        <div id="text-bottom-left" class="text-slot" data-placeholder="Bottom Left"></div>
        <div id="text-bottom-center" class="text-slot" data-placeholder="Bottom Center"></div>
        <div id="text-bottom-right" class="text-slot" data-placeholder="Bottom Right"></div>
        
        <!-- Center media container -->
        <div id="center-media" data-placeholder="Center Media">
        </div>
    </div>

    <div class="debug-info" id="debug-info">
        <div>Overlay Status: <span id="status">Ready</span></div>
        <div>Last Message: <span id="last-message">None</span></div>
        <div>Message Count: <span id="message-count">0</span></div>
    </div>

    <script>
        // Set overlay name for debugging
        const urlParams = new URLSearchParams(window.location.search);
        const extractedOverlayName = urlParams.get('name') || 'main';
        window.overlayName = extractedOverlayName;
        
        // Check if this overlay should be muted (for dashboard preview)
        const isMuted = urlParams.get('muted') === 'true';
        window.overlayMuted = isMuted;
        
        console.log('🔍 Main overlay name extracted:', extractedOverlayName);
        console.log('🔍 Main overlay window.overlayName:', window.overlayName);
        console.log('🔇 Overlay muted mode:', isMuted);
        
        let messageCount = 0;
        
        // Message deduplication - track recently processed messages
        const processedMessages = new Set();
        const MESSAGE_DEDUP_WINDOW = 1000; // 1 second window for deduplication

        // Update debug info
        function updateDebugInfo(message = null) {
            document.getElementById('status').textContent = 'Connected';
            document.getElementById('message-count').textContent = messageCount;
            if (message) {
                document.getElementById('last-message').textContent = new Date().toLocaleTimeString();
            }
        }
        
        // Generate message hash for deduplication
        function getMessageHash(payload) {
            if (!payload) return null;
            // Create a simple hash based on message content
            const hashContent = JSON.stringify({
                type: payload.type,
                slots: payload.slots,
                centerMediaCount: payload.centerMedia ? payload.centerMedia.length : 0,
                timestamp: Math.floor(Date.now() / 100) // Group messages within 100ms
            });
            return hashContent;
        }
        
        // Check if message was recently processed
        function isDuplicateMessage(payload) {
            const hash = getMessageHash(payload);
            if (!hash) return false;
            
            if (processedMessages.has(hash)) {
                console.log('🚫 Duplicate message detected, skipping');
                return true;
            }
            
            // Add to processed set
            processedMessages.add(hash);
            
            // Remove after deduplication window
            setTimeout(() => {
                processedMessages.delete(hash);
            }, MESSAGE_DEDUP_WINDOW);
            
            return false;
        }

        // Render payload function
        function renderPayload(payload) {
            // Safety check for undefined payload
            if (!payload) {
                console.error('❌ renderPayload called with undefined payload');
                return;
            }
            
            // Check for duplicate messages (prevents double-processing from multiple channels)
            if (isDuplicateMessage(payload)) {
                return;
            }
            
            // Log payload summary instead of full object to avoid base64 spam
            const payloadSummary = {
                type: payload.type,
                options: payload.options,
                slots: payload.slots ? Object.keys(payload.slots) : 'none',
                centerMedia: payload.centerMedia ? payload.centerMedia.map(item => ({
                    type: item.type,
                    src: item.src ? (item.src.startsWith('data:') ? 'data:...' : item.src) : 'none'
                })) : 'none'
            };
            console.log('Received payload:', payloadSummary);
            messageCount++;
            updateDebugInfo(payload);
            
            if (!payload.type) {
                console.log('No payload type specified');
                return;
            }
            
            if (payload.type === 'buttonTrigger') {
                handleButtonTrigger(payload);
            } else {
                console.log(`Unknown payload type: ${payload.type}`);
            }
        }
        
        // Map new schema slot names to overlay element IDs
        function mapSlotNameToElementId(slotName) {
            const mapping = {
                'topLeft': 'text-top-left',
                'topCenter': 'text-top-center',
                'topRight': 'text-top-right',
                'midLeft': 'text-mid-left',
                'center': 'text-center',
                'midRight': 'text-mid-right',
                'bottomLeft': 'text-bottom-left',
                'bottomCenter': 'text-bottom-center',
                'bottomRight': 'text-bottom-right'
            };
            return mapping[slotName] || slotName; // Return original if no mapping found
        }

        // Global timer for overlay reset
        let overlayResetTimer = null;
        
        // Handle button trigger payload
        function handleButtonTrigger(payload) {
            // Safety check for undefined payload
            if (!payload) {
                console.error('❌ handleButtonTrigger called with undefined payload');
                return;
            }
            
            // Log payload summary instead of full object to avoid base64 spam
            const payloadSummary = {
                type: payload.type,
                options: payload.options,
                slots: payload.slots ? Object.keys(payload.slots) : 'none',
                centerMedia: payload.centerMedia ? payload.centerMedia.map(item => ({
                    type: item.type,
                    src: item.src ? (item.src.startsWith('data:') ? 'data:...' : item.src) : 'none'
                })) : 'none'
            };
            console.log('🎯 Processing button trigger payload:', payloadSummary);
            
            // Clear any existing reset timer (will be recreated by setupResetTimer)
            if (overlayResetTimer) {
                clearTimeout(overlayResetTimer);
                overlayResetTimer = null;
                console.log('🔄 Cleared existing timer for new trigger');
            }
            
            // Clear previous content if requested
            if (payload.options && payload.options.clearPrevious === true) {
                console.log('🎯 Clearing previous content');
                clearSlots();
            }
            
            // Update text slots
            if (payload.slots) {
                console.log('🎯 Processing slots:', Object.keys(payload.slots));
                Object.keys(payload.slots).forEach(slotName => {
                    const slotData = payload.slots[slotName];
                    const elementId = mapSlotNameToElementId(slotName);
                    const element = document.getElementById(elementId);
                    
                    console.log(`🎯 Processing slot ${slotName}:`, slotData);
                    console.log(`🎯 Slot style:`, slotData.style);
                    console.log(`🎯 Font family in slot:`, slotData.style?.fontFamily);
                    console.log(`🎯 Mapped to element ID: ${elementId}`);
                    console.log(`🎯 Element found:`, element ? 'Yes' : 'No');
                    
                    if (element) {
                        // Clear old content
                        element.innerHTML = '';
                        
                        // Set text content
                        const textContent = slotData.text || '';
                        
                        if (textContent.trim()) {
                            // Create alert text element
                            const textEl = document.createElement('div');
                            textEl.classList.add('alert-text');
                            textEl.textContent = textContent;
                            element.appendChild(textEl);
                            
                            // Show the text slot
                            element.classList.add('active');
                            
                            // Apply inline styles to the text element (not the parent container)
                            if (slotData.style) {
                                // Map schema style properties to CSS properties
                                if (slotData.style.fontFamily) {
                                    console.log('🎨 Applying fontFamily:', slotData.style.fontFamily);
                                    textEl.style.setProperty('font-family', slotData.style.fontFamily, 'important');
                                    console.log('🎨 Element fontFamily after apply:', textEl.style.fontFamily);
                                    console.log('🎨 Computed style:', window.getComputedStyle(textEl).fontFamily);
                                }
                                if (slotData.style.fontSize) {
                                    textEl.style.fontSize = typeof slotData.style.fontSize === 'number' 
                                        ? slotData.style.fontSize + 'px' 
                                        : slotData.style.fontSize;
                                }
                                if (slotData.style.fontWeight) {
                                    textEl.style.fontWeight = slotData.style.fontWeight;
                                }
                                if (slotData.style.color) {
                                    textEl.style.color = slotData.style.color;
                                }
                                if (slotData.style.textShadow) {
                                    textEl.style.textShadow = slotData.style.textShadow;
                                }
                                if (slotData.style.webkitTextStroke) {
                                    textEl.style.webkitTextStroke = slotData.style.webkitTextStroke;
                                }
                                if (slotData.style.textAlign) {
                                    textEl.style.textAlign = slotData.style.textAlign;
                                }
                                if (slotData.style.zIndex) {
                                    textEl.style.zIndex = slotData.style.zIndex;
                                }
                                
                                // Add drop shadow for enhanced visibility
                                textEl.style.filter = 'drop-shadow(0 0 8px rgba(0, 0, 0, 0.8))';
                                
                                // Legacy support
                                if (slotData.style.bold !== undefined) {
                                    textEl.style.fontWeight = slotData.style.bold ? 'bold' : 'normal';
                                }
                                if (slotData.style.italic !== undefined) {
                                    textEl.style.fontStyle = slotData.style.italic ? 'italic' : 'normal';
                                }
                                if (slotData.style.align) {
                                    textEl.style.textAlign = slotData.style.align;
                                }
                            }
                            
                            // Apply animation to the text element if present
                            if (slotData.animation) {
                                console.log('🎬 Animation data received:', slotData.animation);
                                if (slotData.animation.name && slotData.animation.name !== 'none') {
                                    const animName = slotData.animation.name;
                                    const animDuration = slotData.animation.duration || '1s';
                                    const animDelay = slotData.animation.delay || '0s';
                                    const animIterCount = slotData.animation.iterationCount || '1';
                                    const animTiming = slotData.animation.timingFunction || 'ease';
                                    
                                    textEl.style.animationName = animName;
                                    textEl.style.animationDuration = animDuration;
                                    textEl.style.animationDelay = animDelay;
                                    textEl.style.animationIterationCount = animIterCount;
                                    textEl.style.animationTimingFunction = animTiming;
                                    textEl.style.animationFillMode = 'both'; // Keep animation state before and after
                                    
                                    console.log(`🎬 ✅ Applied animation: ${animName} ${animDuration} ${animTiming} ${animDelay} (repeat: ${animIterCount})`);
                                    console.log('🎬 Element style:', textEl.style.cssText);
                                } else {
                                    console.log('🎬 Animation is "none" or missing name, skipping');
                                }
                            } else {
                                console.log('🎬 No animation data in slot');
                            }
                        } else {
                            // Hide the text slot
                            element.classList.remove('active');
                        }
                        
                        console.log(`🎯 Set text content: "${textContent}"`)
                        
                        console.log(`Updated slot ${elementId}: ${slotData.text}`);
                    } else {
                        console.error(`Element not found: ${elementId} (mapped from ${slotName})`);
                    }
                });
            }
            
            // Update center media
            if (payload.centerMedia && Array.isArray(payload.centerMedia)) {
                updateCenterMedia(payload.centerMedia);
            }
            
            // Set up reset timer for the entire alert (text + image)
            setupResetTimer(payload);
        }
        
        // Update center media with multiple items (text, images, videos)
        function showCenterMedia(contentHTML) {
            const centerMedia = document.getElementById('center-media');
            if (!centerMedia) {
                console.error('Center media element not found');
                return;
            }
            
            centerMedia.innerHTML = contentHTML;
            centerMedia.classList.add('show');
        }

        async function updateCenterMedia(mediaItems) {
            const centerMedia = document.getElementById('center-media');
            if (!centerMedia) {
                console.error('Center media element not found');
                return;
            }
            
            // Check if this overlay is in muted mode (dashboard preview)
            if (window.overlayMuted) {
                console.log('🔇 Overlay is in muted mode - skipping all audio/video playback');
                // Only show images, skip audio and video
                let contentHTML = '';
                for (const item of mediaItems) {
                    if (item.type === 'image' || item.type === 'gif') {
                        const imgSrc = item.src || item.url || item.path || item;
                        contentHTML += `<img src="${imgSrc}" alt="Alert image">`;
                        console.log(`🖼️ Added image (muted mode): ${imgSrc}`);
                    } else {
                        console.log(`🔇 Skipping ${item.type} in muted mode`);
                    }
                }
                showCenterMedia(contentHTML);
                return;
            }
            
            // Clear old content first
            centerMedia.innerHTML = '';
            
            let contentHTML = '';
            
            for (const item of mediaItems) {
                if (item.type === 'image' || item.type === 'gif') {
                    // Handle image content
                    const imgSrc = item.src || item.url || item.path || item;
                    contentHTML += `<img src="${imgSrc}" alt="Alert image">`;
                    console.log(`Added image: ${imgSrc}`);
                } else if (item.type === 'video') {
                    // Handle video content
                    const videoSrc = item.src || item.url || item.path || item;
                    const loopAttr = item.loop !== false ? 'loop' : '';
                    // Only mute if explicitly requested, otherwise allow sound
                    const mutedAttr = item.muted === true ? 'muted' : '';
                    const videoId = 'video-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                    const volume = item.volume !== undefined ? item.volume : 1.0;
                    
                    // Regular video
                    contentHTML += `<video id="${videoId}" src="${videoSrc}" ${loopAttr} ${mutedAttr} autoplay playsinline data-volume="${volume}"></video>`;
                    console.log(`🎬 Added video: ${videoSrc}${item.muted === true ? ' (muted)' : ' (with sound)'} at volume ${Math.round(volume * 100)}%`);
                } else if (item.type === 'audio') {
                    // Handle audio content
                    const audioSrc = item.src || item.url || item.path || item;
                    const volume = item.volume !== undefined ? item.volume : 1.0;
                    const loopAttr = item.loop ? 'loop' : '';
                    const autoplayAttr = item.autoplay !== false ? 'autoplay' : '';
                    
                    // Create audio element with volume control
                    const audioId = 'audio-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                    contentHTML += `<audio id="${audioId}" src="${audioSrc}" ${loopAttr} ${autoplayAttr} style="display:none;" data-volume="${volume}"></audio>`;
                    
                    // Set volume immediately after insertion to prevent loud burst
                    setTimeout(() => {
                        const audioEl = document.getElementById(audioId);
                        if (audioEl) {
                            // Set volume before any potential autoplay
                            audioEl.volume = volume;
                            // If autoplay is enabled, ensure volume is set before play starts
                            if (autoplayAttr && !audioEl.paused) {
                                audioEl.pause();
                                audioEl.currentTime = 0;
                                audioEl.volume = volume;
                                audioEl.play().catch(err => console.warn('Audio autoplay failed:', err));
                            }
                            console.log(`🎵 Audio volume set to ${volume} (${Math.round(volume * 100)}%)`);
                            
                            // Listen for ended event to clear overlay when audio finishes (only if not looping)
                            if (!audioEl.hasAttribute('loop')) {
                                audioEl.addEventListener('ended', () => {
                                    console.log('🎵 Audio finished playing - triggering clear all');
                                    console.log('🎵 Audio ended event fired!');
                                    triggerClearAll();
                                }, { once: true });

        function loadAlertConfigurations() {

        // Handle Twitch EventSub events
        function handleTwitchEvent(eventData) {
            console.log('🎭 Processing Twitch event:', eventData.type, eventData.event);
            console.log('🎭 Current savedAlerts count:', savedAlerts.length);
            console.log('🎭 SavedAlerts:', savedAlerts);
            
            // Map Twitch event types to alert types with special handling for subscriptions
            let alertType = null;
            
            if (eventData.type === 'channel.subscribe') {
                // Handle different subscription types based on event data
                if (eventData.event.is_gift === true) {
                    // Check if it's a gift received (someone received a gift) or gift given (someone gave a gift)
                    if (eventData.event.user_id === eventData.event.broadcaster_user_id) {
                        alertType = 'gift-sub-received';
                    } else {
                        alertType = 'gift-sub';
                    }
                } else if (eventData.event.cumulative_months > 1) {
                    alertType = 'resubscriber';
                } else {
                    alertType = 'subscriber';
                }
            } else {
                // Map other event types
                const eventTypeMapping = {
                    'channel.follow': 'follower',
                    'channel.raid': 'raid',
                    'channel.cheer': 'bits',
                    'channel.host': 'host',
                    'channel.unhost': 'unhost',
                    'channel.channel_points_custom_reward_redemption.add': 'channel-points'
                };
                alertType = eventTypeMapping[eventData.type];
            }
            
            if (!alertType) {
                console.log('⚠️ No alert type mapping for event:', eventData.type);
                return;
            }
            
            console.log(`🎯 Mapped event ${eventData.type} to alert type: ${alertType}`);
            
            // Find matching alert configurations
            const matchingAlerts = savedAlerts.filter(alert => 
                alert.type === alertType && alert.enabled !== false
            );
            
            if (matchingAlerts.length === 0) {
                console.log(`⚠️ No enabled alerts found for type: ${alertType}`);
                return;
            }
            
            // Use the first matching alert (or random if randomMode is enabled)
            let selectedAlert = matchingAlerts[0];
            if (matchingAlerts.length > 1) {
                const randomAlerts = matchingAlerts.filter(a => a.randomMode);
                if (randomAlerts.length > 0) {
                    selectedAlert = randomAlerts[Math.floor(Math.random() * randomAlerts.length)];
                }
            }
            
            console.log('🎯 Selected alert for display:', selectedAlert);
            console.log('🎯 Alert type:', selectedAlert.type);
            console.log('🎯 Alert text:', selectedAlert.text);
            
            // Create user data from event
            const userData = {
                username: eventData.event.user_name || eventData.event.from_broadcaster_user_name || 'TestUser',
                displayName: eventData.event.user_login || eventData.event.from_broadcaster_user_login || 'TestUser',
                tier: eventData.event.tier || '1000',
                months: eventData.event.cumulative_months || 1,
                viewers: eventData.event.viewers || 25,
                bits: eventData.event.bits || 100,
                reward: eventData.event.reward?.title || 'Test Reward',
                message: eventData.event.message || ''
            };
            
            // Process the alert with media files
            processAlertWithMedia(selectedAlert, userData);
        }
        
        // Validate alert parameters
        function validateAlertParameters(alertConfig, userData) {
            // Check if alertConfig exists and is an object
            if (!alertConfig || typeof alertConfig !== 'object' || Array.isArray(alertConfig)) {
                console.error('❌ Invalid alertConfig:', alertConfig);
                return false;
            }
            
            // Check if userData exists and is an object
            if (!userData || typeof userData !== 'object' || Array.isArray(userData)) {
                console.error('❌ Invalid userData:', userData);
                return false;
            }
            
            return true;
        }
        
        // Process alert with media files
        function processAlertWithMedia(alertConfig, userData) {
            // Validate parameters
            if (!validateAlertParameters(alertConfig, userData)) {
                console.error('❌ processAlertWithMedia called with invalid parameters');
                console.error('   alertConfig:', alertConfig);
                console.error('   userData:', userData);
                return;
            }
            
            console.log('🎭 Processing alert with media:', alertConfig.type);
            
            // Replace placeholders in text (only if text exists)
            let alertText = alertConfig.text || '';
            if (alertText) {
                alertText = alertText.replace(/{username}/g, userData.username || 'Unknown');
                alertText = alertText.replace(/{displayName}/g, userData.displayName || userData.display_name || 'Unknown');
                alertText = alertText.replace(/{display_name}/g, userData.displayName || userData.display_name || 'Unknown');
                alertText = alertText.replace(/{tier}/g, String(userData.tier || ''));
                alertText = alertText.replace(/{months}/g, String(userData.months || ''));
                alertText = alertText.replace(/{viewers}/g, String(userData.viewers || ''));
                alertText = alertText.replace(/{bits}/g, String(userData.bits || ''));
                alertText = alertText.replace(/{reward}/g, String(userData.reward || ''));
                alertText = alertText.replace(/{message}/g, String(userData.message || ''));
                alertText = alertText.replace(/{total_checkins}/g, String(userData.total_checkins || '0'));
                alertText = alertText.replace(/{streak}/g, String(userData.streak || '0'));
            }
            
            // Create payload for overlay
            const payload = {
                type: 'buttonTrigger',
                options: {
                    duration: alertConfig.duration || 5
                },
                slots: {},
                centerMedia: []
            };
            
            // Only add text slot if there is text
            if (alertText && alertText.trim()) {
                console.log('🎬 Alert animation config:', alertConfig.animation);
                const animationData = (alertConfig.animation && alertConfig.animation.type && alertConfig.animation.type !== 'none') ? {
                    name: alertConfig.animation.type,
                    duration: alertConfig.animation.duration || '1s',
                    delay: alertConfig.animation.delay || '0s',
                    iterationCount: alertConfig.animation.iteration || '1',
                    timingFunction: alertConfig.animation.easing || 'ease'
                } : null;
                
                console.log('🎬 Processed animation data:', animationData);
                
                payload.slots[alertConfig.textStyling?.position || 'topCenter'] = {
                    type: 'text',
                    text: alertText,
                    style: {
                        color: alertConfig.textStyling?.color || '#fff',
                        fontFamily: alertConfig.textStyling?.fontFamily || 'Arial, sans-serif',
                        fontSize: alertConfig.textStyling?.fontSize || '64px',
                        fontWeight: alertConfig.textStyling?.fontWeight || 'bold',
                        textShadow: alertConfig.textStyling?.textShadow || '3px 3px 6px rgba(0, 0, 0, 0.9)',
                        webkitTextStroke: alertConfig.textStyling?.textStroke || '1px #000',
                        zIndex: '15'
                    },
                    animation: animationData
                };
            }
            
            // Add sound file if present
            if (alertConfig.soundFile && alertConfig.soundFile.data) {
                console.log('🎵 Adding sound file to alert');
                const volume = alertConfig.soundFile.volume !== undefined ? alertConfig.soundFile.volume / 100 : 1.0;
                payload.centerMedia.push({
                    type: 'audio',
                    src: alertConfig.soundFile.data,
                    autoplay: true,
                    loop: false,
                    volume: volume  // Volume as decimal (0.0 to 1.0)

                const overlayName = urlParams.get('name') || 'main';
                overlayWS = new WebSocket(`ws://localhost:8080?overlay=${overlayName}`);

                    try {

                        console.log('🔥 WebSocket message received:', message.type);
                        console.log('📨 Received message:', message);
                        console.log('🎯 Current overlay ID:', window.overlayName || 'not set');

                        } else if (message.type && message.event) {

                        } else {
                            console.log('⚠️ Unknown message type:', message.type);
                        }
                    } catch (e) {
                        console.error('❌ Error parsing WebSocket message:', e);
                    }
                };
                
                overlayWS.onclose = function() {
                    console.log('Overlay WebSocket disconnected');
                    overlayWS = null;
                    updateDebugInfo();
                    
                    // Attempt to reconnect
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts++;
                        console.log(`Attempting to reconnect... (${reconnectAttempts}/${maxReconnectAttempts})`);
                        setTimeout(connectWebSocket, 2000);
                    }

                    console.error('Overlay WebSocket error:', error);
                };
            } catch (e) {

        };
    </script>
</body>
