<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Deck Overlay</title>
    <style>
        :root {
            --overlay-width: 1920px;
            --overlay-height: 1080px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow: hidden;
            width: var(--overlay-width);
            height: var(--overlay-height);
            margin: 0;
            padding: 0;
        }

        .overlay-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        /* Text slot styling - can be overridden per slot */
        .text-slot {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            word-wrap: break-word;
            transition: all 0.3s ease;
            min-height: 80px;
        }

        .text-slot:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        /* Show placeholder text invisibly to maintain structure */
        .text-slot:empty::before {
            content: attr(data-placeholder);
            color: transparent;
            display: block;
            width: 100%;
            height: 100%;
            min-height: 80px;
        }
        
        /* Show actual content in white */
        .text-slot:not(:empty) {
            color: white;
        }
        
        /* Center media placeholder */
        #center-media:empty::before {
            content: attr(data-placeholder);
            color: transparent;
            display: block;
            width: 100%;
            height: 100%;
            min-height: 300px;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes fadeIn {
            0% { 
                opacity: 0; 
                transform: scale(0.95);
            }
            100% { 
                opacity: 1; 
                transform: scale(1);
            }
        }

        @keyframes fadeOut {
            0% { 
                opacity: 1; 
                transform: scale(1);
            }
            100% { 
                opacity: 0; 
                transform: scale(0.95);
            }
        }

        /* Center media container */
        #center-media {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid transparent;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            position: relative;
            overflow: hidden;
            grid-column: 2;
            grid-row: 2;
            z-index: 10;
        }

        #center-media img,
        #center-media video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: fadeIn 0.5s ease-out;
        }

        /* Fade animation classes */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in;
        }

        /* Text slot positions */
        #text-top-left {
            grid-column: 1;
            grid-row: 1;
        }

        #text-top-center {
            grid-column: 2;
            grid-row: 1;
        }

        #text-top-right {
            grid-column: 3;
            grid-row: 1;
        }

        #text-mid-left {
            grid-column: 1;
            grid-row: 2;
        }

        #text-center {
            grid-column: 2;
            grid-row: 2;
            z-index: 5; /* Above center media */
        }

        #text-mid-right {
            grid-column: 3;
            grid-row: 2;
        }

        #text-bottom-left {
            grid-column: 1;
            grid-row: 3;
        }

        #text-bottom-center {
            grid-column: 2;
            grid-row: 3;
        }

        #text-bottom-right {
            grid-column: 3;
            grid-row: 3;
        }

        /* Debug info - made transparent */
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: transparent;
            color: transparent;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }

        /* Utility classes for text styling overrides */
        .text-large { font-size: 24px; }
        .text-small { font-size: 12px; }
        .text-bold { font-weight: bold; }
        .text-normal { font-weight: normal; }
        .text-red { color: #ff4444; }
        .text-green { color: #44ff44; }
        .text-blue { color: #4444ff; }
        .text-yellow { color: #ffff44; }
        .text-white { color: white; }
        .bg-red { background: rgba(255, 68, 68, 0.8); }
        .bg-green { background: rgba(68, 255, 68, 0.8); }
        .bg-blue { background: rgba(68, 68, 255, 0.8); }
        .bg-yellow { background: rgba(255, 255, 68, 0.8); }
    </style>
</head>
<body>
    <div class="overlay-container">
        <!-- 9 text slots with specific IDs -->
        <div id="text-top-left" class="text-slot" data-placeholder="Top Left"></div>
        <div id="text-top-center" class="text-slot" data-placeholder="Top Center"></div>
        <div id="text-top-right" class="text-slot" data-placeholder="Top Right"></div>
        <div id="text-mid-left" class="text-slot" data-placeholder="Mid Left"></div>
        <div id="text-center" class="text-slot" data-placeholder="Center"></div>
        <div id="text-mid-right" class="text-slot" data-placeholder="Mid Right"></div>
        <div id="text-bottom-left" class="text-slot" data-placeholder="Bottom Left"></div>
        <div id="text-bottom-center" class="text-slot" data-placeholder="Bottom Center"></div>
        <div id="text-bottom-right" class="text-slot" data-placeholder="Bottom Right"></div>
        
        <!-- Center media container -->
        <div id="center-media" data-placeholder="Center Media">
        </div>
    </div>

    <div class="debug-info" id="debug-info">
        <div>Overlay Status: <span id="status">Ready</span></div>
        <div>Last Message: <span id="last-message">None</span></div>
        <div>Message Count: <span id="message-count">0</span></div>
    </div>

    <script>
        let messageCount = 0;

        // Update debug info
        function updateDebugInfo(message = null) {
            document.getElementById('status').textContent = 'Connected';
            document.getElementById('message-count').textContent = messageCount;
            if (message) {
                document.getElementById('last-message').textContent = new Date().toLocaleTimeString();
            }
        }

        // Render payload function
        function renderPayload(payload) {
            console.log('Received payload:', payload);
            messageCount++;
            updateDebugInfo(payload);
            
            if (!payload.type) {
                console.log('No payload type specified');
                return;
            }
            
            if (payload.type === 'buttonTrigger') {
                handleButtonTrigger(payload);
            } else {
                console.log(`Unknown payload type: ${payload.type}`);
            }
        }
        
        // Map new schema slot names to overlay element IDs
        function mapSlotNameToElementId(slotName) {
            const mapping = {
                'topLeft': 'text-top-left',
                'topCenter': 'text-top-center',
                'topRight': 'text-top-right',
                'midLeft': 'text-mid-left',
                'center': 'text-center',
                'midRight': 'text-mid-right',
                'bottomLeft': 'text-bottom-left',
                'bottomCenter': 'text-bottom-center',
                'bottomRight': 'text-bottom-right'
            };
            return mapping[slotName] || slotName; // Return original if no mapping found
        }

        // Global timer for overlay reset
        let overlayResetTimer = null;
        
        // Handle button trigger payload
        function handleButtonTrigger(payload) {
            console.log('🎯 Processing button trigger payload:', payload);
            console.log('🎯 Payload type:', payload.type);
            console.log('🎯 Payload options:', payload.options);
            console.log('🎯 Payload slots:', payload.slots);
            console.log('🎯 Payload centerMedia:', payload.centerMedia);
            
            // Clear any existing reset timer
            if (overlayResetTimer) {
                clearTimeout(overlayResetTimer);
                overlayResetTimer = null;
            }
            
            // Clear previous content if requested
            if (payload.options && payload.options.clearPrevious === true) {
                console.log('🎯 Clearing previous content');
                clearSlots();
            }
            
            // Update text slots
            if (payload.slots) {
                console.log('🎯 Processing slots:', Object.keys(payload.slots));
                Object.keys(payload.slots).forEach(slotName => {
                    const slotData = payload.slots[slotName];
                    const elementId = mapSlotNameToElementId(slotName);
                    const element = document.getElementById(elementId);
                    
                    console.log(`🎯 Processing slot ${slotName}:`, slotData);
                    console.log(`🎯 Mapped to element ID: ${elementId}`);
                    console.log(`🎯 Element found:`, element ? 'Yes' : 'No');
                    
                    if (element) {
                        // Set text content
                        const textContent = slotData.text || '';
                        element.textContent = textContent;
                        console.log(`🎯 Set text content: "${textContent}"`);
                        
                        // Apply inline styles with proper CSS property mapping
                        if (slotData.style) {
                            // Map schema style properties to CSS properties
                            if (slotData.style.fontFamily) {
                                element.style.fontFamily = slotData.style.fontFamily;
                            }
                            if (slotData.style.fontSize) {
                                element.style.fontSize = typeof slotData.style.fontSize === 'number' 
                                    ? slotData.style.fontSize + 'px' 
                                    : slotData.style.fontSize;
                            }
                            if (slotData.style.color) {
                                element.style.color = slotData.style.color;
                            }
                            if (slotData.style.bold !== undefined) {
                                element.style.fontWeight = slotData.style.bold ? 'bold' : 'normal';
                            }
                            if (slotData.style.italic !== undefined) {
                                element.style.fontStyle = slotData.style.italic ? 'italic' : 'normal';
                            }
                            if (slotData.style.align) {
                                element.style.textAlign = slotData.style.align;
                            }
                            if (slotData.style.animation) {
                                element.style.animationName = slotData.style.animation;
                                element.style.animationDuration = '1s';
                            }
                        }
                        
                        console.log(`Updated slot ${elementId}: ${slotData.text}`);
                    } else {
                        console.error(`Element not found: ${elementId} (mapped from ${slotName})`);
                    }
                });
            }
            
            // Update center media
            if (payload.centerMedia && Array.isArray(payload.centerMedia)) {
                updateCenterMedia(payload.centerMedia);
            }
            
            // Set up reset timer for the entire button trigger
            setupResetTimer(payload);
        }
        
        // Update center media with multiple items
        async function updateCenterMedia(mediaItems) {
            const centerMedia = document.getElementById('center-media');
            if (!centerMedia) {
                console.error('Center media element not found');
                return;
            }
            
            // Add fade out animation if there's existing content
            if (centerMedia.children.length > 0) {
                centerMedia.classList.add('fade-out');
                // Wait for fade out to complete before clearing
                setTimeout(() => {
                    centerMedia.innerHTML = '';
                    centerMedia.classList.remove('fade-out');
                }, 300);
            } else {
                centerMedia.innerHTML = '';
            }
            
            const videoElements = [];
            
            for (const item of mediaItems) {
                if (item.type === 'image' || item.type === 'gif') {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = item.alt || 'Media';
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '100%';
                    img.style.objectFit = 'contain';
                    img.style.display = 'block';
                    centerMedia.appendChild(img);
                    
                    // Log image info without full base64
                    const srcType = item.src.startsWith('data:') ? 'base64' : 
                                   item.src.startsWith('blob:') ? 'blob' : 
                                   item.src.startsWith('http') ? 'url' : 'path';
                    const srcPreview = srcType === 'base64' ? 
                                      `${item.src.substring(0, 30)}... (${(item.src.length / 1024).toFixed(2)} KB)` : 
                                      item.src;
                    console.log(`Added image [${srcType}]: ${srcPreview}`);
                    
                        } else if (item.type === 'video') {
                            const video = document.createElement('video');
                            video.src = item.src;
                            video.autoplay = true;
                            video.muted = true; // Muted for autoplay to work
                            video.loop = item.loop || false;
                            video.playsInline = true;
                            video.controls = false;
                            video.preload = 'auto'; // Preload the video
                            video.setAttribute('webkit-playsinline', 'true'); // iOS compatibility
                            video.setAttribute('playsinline', 'true'); // iOS compatibility
                            video.style.maxWidth = '100%';
                            video.style.maxHeight = '100%';
                            video.style.objectFit = 'contain';
                            video.style.display = 'block';
                            
                            // Add error handling
                            video.onerror = function() {
                                console.error(`Failed to load video: ${item.src}`);
                            };
                            
                            // Force play when video can play
                            video.oncanplay = function() {
                                console.log(`Video can play: ${item.src}`);
                                video.play().catch(err => {
                                    console.warn(`Force play failed: ${err}`);
                                });
                            };
                            
                            // Also try to play when loaded
                            video.onloadeddata = function() {
                                console.log(`Video loaded: ${item.src}`);
                                video.play().catch(err => {
                                    console.warn(`Loaded data play failed: ${err}`);
                                });
                            };
                            
                            centerMedia.appendChild(video);
                            videoElements.push(video);
                            
                            console.log(`Added video: ${item.src}`);
                        }
            }
            
            // Try to play all videos with multiple attempts
            if (videoElements.length > 0) {
                videoElements.forEach(video => {
                    // Try immediate play
                    video.play().catch(error => {
                        console.warn(`Immediate play failed for ${video.src}:`, error);
                        
                        // Try again after a short delay
                        setTimeout(() => {
                            video.play().catch(error2 => {
                                console.warn(`Delayed play failed for ${video.src}:`, error2);
                                
                                // Try one more time after video is ready
                                video.addEventListener('canplay', () => {
                                    video.play().catch(error3 => {
                                        console.warn(`Final play attempt failed for ${video.src}:`, error3);
                                        showPlayOverlay(video);
                                    });
                                }, { once: true });
                            });
                        }, 100);
                    });
                });
                console.log('Attempted to play all videos with multiple retries');
            }
            
            // Add fade-in animation to new content
            setTimeout(() => {
                centerMedia.classList.add('fade-in');
                // Remove the class after animation completes
                setTimeout(() => {
                    centerMedia.classList.remove('fade-in');
                }, 500);
            }, 50);
            
            console.log('🎯 Center media update completed');
        }
        
        // Set up reset timer based on payload options or default
        function setupResetTimer(payload) {
            let resetDelay = 60000; // Default 1 minute (60 seconds)
            
            // Check for custom duration in options
            if (payload.options && payload.options.durationMs) {
                resetDelay = payload.options.durationMs;
                console.log('🔄 Using custom duration:', resetDelay, 'ms');
            } else {
                console.log('🔄 Using default duration:', resetDelay, 'ms');
            }
            
            // Set the reset timer
            overlayResetTimer = setTimeout(() => {
                console.log('🔄 Auto-resetting overlay after', resetDelay, 'ms');
                clearSlots();
                overlayResetTimer = null;
            }, resetDelay);
            
            console.log('🔄 Reset timer set for', resetDelay, 'ms');
        }
        
        // Show play overlay for autoplay-blocked videos
        function showPlayOverlay(video) {
            const overlay = document.createElement('div');
            overlay.style.position = 'absolute';
            overlay.style.top = '50%';
            overlay.style.left = '50%';
            overlay.style.transform = 'translate(-50%, -50%)';
            overlay.style.background = 'rgba(0, 0, 0, 0.7)';
            overlay.style.color = 'white';
            overlay.style.padding = '10px 20px';
            overlay.style.borderRadius = '5px';
            overlay.style.cursor = 'pointer';
            overlay.style.zIndex = '10';
            overlay.innerHTML = '▶️ Click to Play';
            
            overlay.addEventListener('click', () => {
                video.play().then(() => {
                    overlay.remove();
                }).catch(error => {
                    console.error('Manual play failed:', error);
                });
            });
            
            video.parentElement.style.position = 'relative';
            video.parentElement.appendChild(overlay);
        }
        
        // Clear all slots helper
        function clearSlots() {
            // Clear any existing reset timer
            if (overlayResetTimer) {
                clearTimeout(overlayResetTimer);
                overlayResetTimer = null;
            }
            
            // Clear text slots
            const textSlots = document.querySelectorAll('.text-slot');
            textSlots.forEach(slot => {
                slot.textContent = '';
                slot.style.cssText = ''; // Clear inline styles
            });
            
            // Clear center media with fade out
            const centerMedia = document.getElementById('center-media');
            if (centerMedia.children.length > 0) {
                centerMedia.classList.add('fade-out');
                setTimeout(() => {
                    centerMedia.innerHTML = '';
                    centerMedia.classList.remove('fade-out');
                }, 300);
            } else {
                centerMedia.innerHTML = '';
            }
            
            console.log('🔄 All slots cleared');
        }
        
        // Manual reset function (can be called from console or external)
        window.resetOverlay = function() {
            console.log('🔄 Manual overlay reset triggered');
            clearSlots();
        };

        // Global function to change overlay resolution
        window.setOverlayResolution = function(width, height) {
            document.documentElement.style.setProperty('--overlay-width', width + 'px');
            document.documentElement.style.setProperty('--overlay-height', height + 'px');
            console.log(`📐 Overlay resolution changed to ${width}x${height}`);
        };

        // Standard resolution presets
        window.overlayResolutions = {
            '1920x1080': { width: 1920, height: 1080 },
            '1280x720': { width: 1280, height: 720 },
            '1366x768': { width: 1366, height: 768 },
            '1600x900': { width: 1600, height: 900 },
            '2560x1440': { width: 2560, height: 1440 },
            '3840x2160': { width: 3840, height: 2160 },
            '1024x768': { width: 1024, height: 768 },
            '1280x1024': { width: 1280, height: 1024 }
        };
        
        // Expose clearSlots globally for external access
        window.clearSlots = clearSlots;
        
        // Legacy clear function for backward compatibility
        function clearAllSlots() {
            clearSlots();
        }

        // Global test function for console testing
        window.testRender = function(payload) {
            console.log('Testing render with payload:', payload);
            renderPayload(payload);
        };
        
        // Sample test payload for quick testing
        window.testSamplePayload = {
            type: 'buttonTrigger',
            options: {
                clearPrevious: true
            },
            slots: {
                'text-top-left': {
                    text: 'Top Left Text',
                    style: {
                        fontFamily: 'Arial, sans-serif',
                        fontSize: '24px',
                        color: '#ff0000',
                        fontWeight: 'bold',
                        textAlign: 'left',
                        zIndex: '1'
                    }
                },
                'text-top-center': {
                    text: 'Top Center Text',
                    style: {
                        fontFamily: 'Georgia, serif',
                        fontSize: '20px',
                        color: '#00ff00',
                        fontWeight: 'normal',
                        textAlign: 'center',
                        zIndex: '2'
                    }
                },
                'text-top-right': {
                    text: 'Top Right Text',
                    style: {
                        fontFamily: 'Courier, monospace',
                        fontSize: '18px',
                        color: '#0000ff',
                        fontWeight: 'italic',
                        textAlign: 'right',
                        zIndex: '3'
                    }
                },
                'text-bottom-left': {
                    text: 'Bottom Left Text',
                    style: {
                        fontFamily: 'Verdana, sans-serif',
                        fontSize: '16px',
                        color: '#ffff00',
                        fontWeight: 'bold',
                        textAlign: 'left',
                        zIndex: '4'
                    }
                },
                'text-bottom-right': {
                    text: 'Bottom Right Text',
                    style: {
                        fontFamily: 'Times, serif',
                        fontSize: '14px',
                        color: '#ff00ff',
                        fontWeight: 'normal',
                        textAlign: 'right',
                        zIndex: '5'
                    }
                }
            },
            centerMedia: [
                {
                    type: 'image',
                    src: 'https://via.placeholder.com/400x300/ff00ff/ffffff?text=Test+Image',
                    alt: 'Test Image'
                },
                {
                    type: 'video',
                    src: 'https://sample-videos.com/zip/10/mp4/SampleVideo_1280x720_1mb.mp4',
                    loop: true
                }
            ]
        };
        
        // Multi-source test function
        window.testMultiSource = function() {
            console.log('Testing multi-source capability...');
            const payload = {
                type: 'buttonTrigger',
                options: {
                    clearPrevious: true
                },
                slots: {
                    'text-top-left': {
                        text: '🎮 GAME START',
                        style: {
                            fontFamily: 'Arial, sans-serif',
                            fontSize: '28px',
                            color: '#00ff00',
                            fontWeight: 'bold',
                            textAlign: 'center',
                            textShadow: '2px 2px 4px rgba(0,0,0,0.8)',
                            zIndex: '10'
                        }
                    },
                    'text-top-right': {
                        text: 'SCORE: 9999',
                        style: {
                            fontFamily: 'Courier, monospace',
                            fontSize: '24px',
                            color: '#ffff00',
                            fontWeight: 'bold',
                            textAlign: 'right',
                            textShadow: '2px 2px 4px rgba(0,0,0,0.8)',
                            zIndex: '10'
                        }
                    },
                    'text-bottom-center': {
                        text: 'PRESS SPACE TO CONTINUE',
                        style: {
                            fontFamily: 'Arial, sans-serif',
                            fontSize: '20px',
                            color: '#ffffff',
                            fontWeight: 'bold',
                            textAlign: 'center',
                            textShadow: '2px 2px 4px rgba(0,0,0,0.8)',
                            animationName: 'pulse',
                            animationDuration: '1s',
                            animationIterationCount: 'infinite',
                            zIndex: '10'
                        }
                    }
                },
                centerMedia: [
                    {
                        type: 'image',
                        src: 'https://via.placeholder.com/600x400/000000/ffffff?text=GAME+SCREEN',
                        alt: 'Game Screen'
                    },
                    {
                        type: 'video',
                        src: 'https://sample-videos.com/zip/10/mp4/SampleVideo_1280x720_1mb.mp4',
                        loop: true
                    }
                ]
            };
            
            renderPayload(payload);
        };
        
        // Listen for messages from parent window (OBS Browser Source)
        window.addEventListener('message', function(event) {
            console.log('🔔 Overlay received message:', event);
            console.log('🔔 Event data:', event.data);
            console.log('🔔 Event data type:', typeof event.data);
            console.log('🔔 Event data keys:', event.data ? Object.keys(event.data) : 'No data');
            
            // Handle the message structure: { type: 'buttonTrigger', payload: overlayPayload }
            if (event.data && event.data.type === 'buttonTrigger' && event.data.payload) {
                console.log('🔔 Processing wrapped payload:', event.data.payload);
                renderPayload(event.data.payload);
            } else if (event.data && event.data.type === 'buttonTrigger') {
                console.log('🔔 Processing direct payload:', event.data);
                renderPayload(event.data);
            } else if (event.data) {
                console.log('🔔 Processing fallback payload:', event.data);
                renderPayload(event.data);
            } else {
                console.log('🔔 No valid data in message');
            }
        });

        // Also listen for WebSocket messages (for our current implementation)
        let overlayWS = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function connectWebSocket() {
            try {
                overlayWS = new WebSocket('ws://localhost:8080');
                
                overlayWS.onopen = function() {
                    console.log('Overlay WebSocket connected');
                    reconnectAttempts = 0;
                    updateDebugInfo();
                };
                
                overlayWS.onmessage = function(event) {
                    try {
                        const message = JSON.parse(event.data);
                        renderPayload(message);
                    } catch (e) {
                        console.error('Error parsing WebSocket message:', e);
                    }
                };
                
                overlayWS.onclose = function() {
                    console.log('Overlay WebSocket disconnected');
                    overlayWS = null;
                    updateDebugInfo();
                    
                    // Attempt to reconnect
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts++;
                        console.log(`Attempting to reconnect... (${reconnectAttempts}/${maxReconnectAttempts})`);
                        setTimeout(connectWebSocket, 2000);
                    }
                };
                
                overlayWS.onerror = function(error) {
                    console.error('Overlay WebSocket error:', error);
                };
            } catch (e) {
                console.error('Failed to create WebSocket connection:', e);
            }
        }

        // Connect to WebSocket when page loads
        connectWebSocket();

        // Initialize debug info
        updateDebugInfo();

        // Global functions for testing
        window.testOverlay = function() {
            renderPayload({
                type: 'test',
                data: { message: 'Test from console' }
            });
        };

        window.clearOverlay = function() {
            // Clear all text slots
            const textSlots = document.querySelectorAll('.text-slot');
            textSlots.forEach(slot => {
                slot.textContent = '';
            });
            
            // Clear center media
            const centerMedia = document.getElementById('center-media');
            centerMedia.innerHTML = '';
            
            console.log('Overlay cleared');
        };

        console.log('Overlay loaded successfully!');
        console.log('Available test functions:');
        console.log('- testOverlay() - Test the overlay');
        console.log('- clearOverlay() - Clear all content');
    </script>
</body>
</html>
