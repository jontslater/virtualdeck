<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydration Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: transparent;
    }
    #hydration-container {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #hydration-plate {
      padding: 14px 20px 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    .hidden { display: none !important; }
    .hydration-stats {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin-top: 6px;
    }
    .hydration-text { font-weight: 800; letter-spacing: 0.02em; }
    #hydration-amount-main { font-size: 3rem; line-height: 1.05; }
    #hydration-amount-goal { font-size: 1.35rem; opacity: 0.95; }
    .hydration-chips {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hydration-chip {
      font-size: 1.2rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      border: 3px solid #4fc3f7;
      min-width: 3.5rem;
      text-align: center;
    }
    canvas { display: block; }
    #minimal-ring-wrap {
      position: relative;
      width: var(--minimal-size, 280px);
      height: var(--minimal-size, 280px);
    }
    .minimal-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    #minimal-fx-canvas {
      position: absolute;
      inset: 12%;
      width: 76%;
      height: 76%;
      pointer-events: none;
    }
    .minimal-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: none;
      z-index: 2;
    }
    #minimal-amount-main { font-size: 2rem; line-height: 1.1; }
    #minimal-amount-sub { font-size: 1rem; opacity: 0.92; margin-top: 4px; }
    .fx-number-pop #hydration-amount-main,
    #minimal-ring-wrap.fx-number-pop #minimal-amount-main {
      animation: num-pop 0.55s ease-out;
    }
    @keyframes num-pop {
      30% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fx-number-pop #hydration-amount-main,
      #minimal-ring-wrap.fx-number-pop #minimal-amount-main { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="hydration-container">
    <div id="hydration-plate">
      <div data-gauge="circular">
        <canvas id="canvas-circular" data-gauge-canvas="circle" width="280" height="280"></canvas>
      </div>
      <div data-gauge="bottle" class="hidden">
        <canvas id="canvas-bottle" data-gauge-canvas="circle" width="168" height="280"></canvas>
      </div>
      <div data-gauge="vertical" class="hidden">
        <canvas id="canvas-vertical" data-gauge-canvas="vert" width="98" height="280"></canvas>
      </div>
      <div data-gauge="horizontal" class="hidden">
        <canvas id="canvas-horizontal" data-gauge-canvas="horiz" width="392" height="98"></canvas>
      </div>
      <div data-gauge="minimal" class="hidden">
        <div id="minimal-ring-wrap">
          <svg class="minimal-svg" viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="84" fill="rgba(0,0,0,0.45)" stroke="none" />
            <circle id="minimal-track-arc" cx="100" cy="100" r="84" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="12" />
            <circle id="minimal-progress-arc" cx="100" cy="100" r="84" fill="none" stroke="#4fc3f7" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="0 528" transform="rotate(-90 100 100)" />
          </svg>
          <canvas id="minimal-fx-canvas" width="200" height="200"></canvas>
          <div class="minimal-inner">
            <span id="minimal-amount-main" class="hydration-text">0 oz</span>
            <span id="minimal-amount-sub" class="hydration-text">50% · of 64 oz</span>
          </div>
        </div>
      </div>
      <div class="hydration-stats" id="hydration-stats-block">
        <span id="hydration-amount-main" class="hydration-text">0 oz</span>
        <span id="hydration-amount-goal" class="hydration-text">of 64 oz</span>
      </div>
      <div class="hydration-chips">
        <span id="hydration-pct-chip" class="hydration-chip">0%</span>
        <span id="hydration-streak-chip" class="hydration-chip">🔥 0</span>
      </div>
    </div>
  </div>
  <script src="/hydration-overlay.js"></script>
</body>
</html>
