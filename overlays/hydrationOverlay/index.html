<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydration Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: transparent;
    }
    html.hydration-embed-preview,
    html.hydration-embed-preview body {
      width: 100%;
      height: 100%;
    }
    #hydration-container {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #hydration-plate {
      padding: 14px 20px 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    .hidden { display: none !important; }
    .hydration-stats {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin-top: 6px;
    }
    .hydration-text { font-weight: 800; letter-spacing: 0.02em; }
    #hydration-amount-main { font-size: 3rem; line-height: 1.05; }
    #hydration-amount-goal { font-size: 1.35rem; opacity: 0.95; }
    .hydration-chips {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hydration-chip {
      font-size: 1.2rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      border: 3px solid #4fc3f7;
      min-width: 3.5rem;
      text-align: center;
    }
    canvas { display: block; }
    #minimal-ring-wrap {
      position: relative;
      width: var(--minimal-size, 280px);
      height: var(--minimal-size, 280px);
    }
    .minimal-svg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
    }
    #minimal-water-canvas {
      position: absolute;
      inset: 12%;
      width: 76%;
      height: 76%;
      pointer-events: none;
      z-index: 0;
    }
    .minimal-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: none;
      z-index: 2;
    }
    .minimal-inner .hydration-text {
      font-weight: 900;
      letter-spacing: 0.02em;
      paint-order: stroke fill;
      -webkit-text-stroke: 2px #000000;
      text-shadow:
        1px 0 0 #000,
        -1px 0 0 #000,
        0 1px 0 #000,
        0 -1px 0 #000,
        1.5px 1.5px 0 #000,
        -1.5px -1.5px 0 #000,
        1.5px -1.5px 0 #000,
        -1.5px 1.5px 0 #000;
    }
    #minimal-amount-main { font-size: 2.2rem; line-height: 1.08; }
    #minimal-amount-sub { font-size: 1.05rem; margin-top: 5px; opacity: 1; }
    .fx-number-pop #hydration-amount-main,
    #minimal-ring-wrap.fx-number-pop #minimal-amount-main {
      animation: num-pop 0.55s ease-out;
    }
    @keyframes num-pop {
      30% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fx-number-pop #hydration-amount-main,
      #minimal-ring-wrap.fx-number-pop #minimal-amount-main { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="hydration-container">
    <div id="hydration-plate">
      <div data-gauge="circular">
        <canvas id="canvas-circular" data-gauge-canvas="circle" width="280" height="280"></canvas>
      </div>
      <div data-gauge="bottle" class="hidden">
        <canvas id="canvas-bottle" data-gauge-canvas="circle" width="168" height="280"></canvas>
      </div>
      <div data-gauge="vertical" class="hidden">
        <canvas id="canvas-vertical" data-gauge-canvas="vert" width="98" height="280"></canvas>
      </div>
      <div data-gauge="horizontal" class="hidden">
        <canvas id="canvas-horizontal" data-gauge-canvas="horiz" width="392" height="98"></canvas>
      </div>
      <div data-gauge="minimal" class="hidden">
        <div id="minimal-ring-wrap">
          <svg class="minimal-svg" viewBox="0 0 200 200" aria-hidden="true">
            <circle id="minimal-border-ring" cx="100" cy="100" r="84" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="3" />
          </svg>
          <canvas id="minimal-water-canvas" width="200" height="200"></canvas>
          <div class="minimal-inner">
            <span id="minimal-amount-main" class="hydration-text">0 oz</span>
            <span id="minimal-amount-sub" class="hydration-text">50% · of 64 oz</span>
          </div>
        </div>
      </div>
      <div class="hydration-stats" id="hydration-stats-block">
        <span id="hydration-amount-main" class="hydration-text">0 oz</span>
        <span id="hydration-amount-goal" class="hydration-text">of 64 oz</span>
      </div>
      <div class="hydration-chips">
        <span id="hydration-pct-chip" class="hydration-chip">0%</span>
        <span id="hydration-streak-chip" class="hydration-chip">🔥 0</span>
      </div>
    </div>
  </div>
  <script>
    if (/[?&]preview=1/.test(location.search)) {
      document.documentElement.classList.add('hydration-embed-preview');
    }
  </script>
  <script src="/hydration-overlay.js"></script>
</body>
</html>
