<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydration Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: transparent;
    }
    #hydration-container {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
  #hydration-plate {
      padding: 14px 20px 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    .hidden { display: none !important; }
    .hydration-stats {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin-top: 6px;
    }
    .hydration-text { font-weight: 800; letter-spacing: 0.02em; }
    #hydration-amount-main { font-size: 2.4rem; line-height: 1.05; }
    #hydration-amount-goal { font-size: 1.2rem; opacity: 0.95; }
    .hydration-chips {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hydration-chip {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 2px solid #4fc3f7;
    }
    canvas { display: block; }
    #effects-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #effects-layer.flash {
      animation: flash 0.45s ease-out;
    }
    @keyframes flash {
      from { background: rgba(79, 195, 247, 0.25); }
      to { background: transparent; }
    }
    .confetti-piece {
      position: absolute;
      top: 35%;
      width: 8px;
      height: 14px;
      border-radius: 2px;
      animation: confetti-fall 2s ease-in forwards;
    }
    @keyframes confetti-fall {
      to {
        transform: translateY(420px) rotate(540deg);
        opacity: 0;
      }
    }
    #minimal-ring {
      --progress: 0%;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: conic-gradient(#4fc3f7 var(--progress), rgba(255,255,255,0.15) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #minimal-ring::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
    }
    .minimal-inner {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .fx-sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #fff 20%, transparent 70%);
      animation: sparkle-pop 0.9s ease-out forwards;
    }
    @keyframes sparkle-pop {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .fx-splash {
      position: absolute;
      left: 50%;
      top: 45%;
      width: 120px;
      height: 120px;
      margin: -60px 0 0 -60px;
      border: 3px solid rgba(79,195,247,0.8);
      border-radius: 50%;
      animation: ripple 0.85s ease-out forwards;
    }
    @keyframes ripple {
      from { transform: scale(0.3); opacity: 0.9; }
      to { transform: scale(1.6); opacity: 0; }
    }
    .fx-bubble {
      position: absolute;
      bottom: 35%;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      animation: bubble-rise 1.1s ease-out forwards;
    }
    @keyframes bubble-rise {
      to { transform: translateY(-80px); opacity: 0; }
    }
    .fx-number-pop #hydration-amount-main {
      animation: num-pop 0.55s ease-out;
    }
    @keyframes num-pop {
      30% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .confetti-piece, #effects-layer.flash,
      .fx-sparkle, .fx-splash, .fx-bubble, .fx-number-pop #hydration-amount-main { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="effects-layer" aria-hidden="true"></div>
  <div id="hydration-container">
    <div id="hydration-plate">
      <div data-gauge="circular">
        <canvas id="canvas-circular" data-gauge-canvas="circle" width="200" height="200"></canvas>
      </div>
      <div data-gauge="bottle" class="hidden">
        <canvas id="canvas-bottle" data-gauge-canvas="circle" width="120" height="200"></canvas>
      </div>
      <div data-gauge="vertical" class="hidden">
        <canvas id="canvas-vertical" data-gauge-canvas="vert" width="70" height="200"></canvas>
      </div>
      <div data-gauge="horizontal" class="hidden">
        <canvas id="canvas-horizontal" data-gauge-canvas="horiz" width="280" height="70"></canvas>
      </div>
      <div data-gauge="minimal" class="hidden">
        <div id="minimal-ring">
          <div class="minimal-inner">
            <span id="minimal-pct" class="hydration-text" style="font-size:1.8rem">0%</span>
          </div>
        </div>
      </div>
      <div class="hydration-stats" id="hydration-stats-block">
        <span id="hydration-amount-main" class="hydration-text">0 oz</span>
        <span id="hydration-amount-goal" class="hydration-text">of 64 oz</span>
      </div>
      <div class="hydration-chips">
        <span id="hydration-pct-chip" class="hydration-chip">0%</span>
        <span id="hydration-streak-chip" class="hydration-chip">🔥 0</span>
      </div>
    </div>
  </div>
  <script src="/hydration-overlay.js"></script>
</body>
</html>
