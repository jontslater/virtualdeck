<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Streak Alerts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body.obs-checker {
      background-color: #1a1a1a;
      background-image:
        linear-gradient(45deg, #252525 25%, transparent 25%),
        linear-gradient(-45deg, #252525 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #252525 75%),
        linear-gradient(-45deg, transparent 75%, #252525 75%);
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0;
    }
    #stage {
      width: 1920px;
      height: 1080px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #alert-root {
      position: relative;
      opacity: 0;
      transform: translateY(28px) scale(0.72);
      transition: opacity 0.35s ease, transform 0.55s cubic-bezier(0.2, 0.95, 0.25, 1.15);
      text-align: center;
      border-radius: 22px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 0, 0, 0.35);
    }
    #alert-root.visible {
      opacity: 1;
      transform: translateY(0) scale(var(--ws-scale, 1));
    }
    #alert-root.hold-peak {
      animation: none !important;
      opacity: 1 !important;
      transform: translateY(0) scale(var(--ws-scale, 1)) !important;
      filter: brightness(1.15);
    }
    #alert-root.effect-glow.visible { animation: ws-glow 2.4s ease-in-out 1 forwards; }
    #alert-root.effect-pulse.visible { animation: ws-pulse 1.4s ease-in-out 2 forwards; }
    #alert-root.effect-shine.visible { overflow: hidden; }
    #alert-root.effect-shine.visible::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%);
      animation: ws-shine 1.6s ease-in-out 2;
      pointer-events: none;
    }
    #alert-root.effect-flare.visible { animation: ws-flare 2.2s ease-out 1 forwards; }
    #alert-root.effect-burst.visible { animation: ws-burst 2.5s ease-out 1 forwards; }
    #alert-root.effect-epic.visible {
      animation: ws-epic 2.8s ease-out 1 forwards;
      box-shadow: 0 24px 70px rgba(255, 193, 7, 0.35), 0 0 80px rgba(255, 87, 34, 0.25);
    }
    #alert-root.effect-confetti.visible {
      animation: ws-epic 3s ease-out 1 forwards;
      box-shadow: 0 28px 90px rgba(255, 215, 64, 0.45), 0 0 100px rgba(233, 30, 99, 0.3);
    }
    .ws-label {
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ws-accent, #ffd54f);
      text-shadow: 0 2px 0 #000, 0 0 16px rgba(0,0,0,0.9);
      margin-bottom: 10px;
    }
    #ws-title {
      font-weight: 900;
      color: var(--ws-text, #fff);
      line-height: 1.12;
      text-shadow: 0 4px 0 #000, 0 0 22px rgba(0,0,0,0.9), 2px 2px 0 #000;
    }
    #ws-sub {
      margin-top: 12px;
      font-weight: 700;
      color: #f8f8f8;
      text-shadow: 0 2px 0 #000, 0 0 14px rgba(0,0,0,0.85);
    }
    @keyframes ws-glow {
      0% { filter: brightness(0.85); }
      50% { filter: brightness(1.2); box-shadow: 0 22px 55px rgba(255,255,255,0.15); }
      100% { filter: brightness(1); }
    }
    @keyframes ws-pulse {
      0%, 100% { transform: translateY(0) scale(var(--ws-scale, 1)); }
      50% { transform: translateY(0) scale(calc(var(--ws-scale, 1) * 1.06)); filter: brightness(1.2); }
    }
    @keyframes ws-shine {
      from { transform: translateX(-130%); }
      to { transform: translateX(130%); }
    }
    @keyframes ws-flare {
      0% { transform: scale(0.55); opacity: 0; filter: brightness(0.5); }
      45% { transform: scale(calc(var(--ws-scale, 1) * 1.1)); opacity: 1; filter: brightness(1.35); }
      100% { transform: scale(var(--ws-scale, 1)); opacity: 1; }
    }
    @keyframes ws-burst {
      0% { transform: scale(0.4) rotate(-6deg); opacity: 0; }
      40% { transform: scale(calc(var(--ws-scale, 1) * 1.14)) rotate(2deg); opacity: 1; }
      100% { transform: scale(var(--ws-scale, 1)) rotate(0); opacity: 1; }
    }
    @keyframes ws-epic {
      0% { transform: scale(0.3); opacity: 0; filter: blur(8px); }
      35% { opacity: 1; filter: blur(0); }
      55% { transform: scale(calc(var(--ws-scale, 1) * 1.12)); }
      100% { transform: scale(var(--ws-scale, 1)); opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="fx-canvas" width="1920" height="1080"></canvas>
  <div id="stage">
    <div id="alert-root" aria-live="polite">
      <div class="ws-label">Watch streak</div>
      <div id="ws-title"></div>
      <div id="ws-sub"></div>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (params.has('obs') || params.has('preview')) {
        document.body.classList.add('obs-checker');
      }
      const OVERLAY_NAME = 'watchStreak';
      const root = document.getElementById('alert-root');
      const titleEl = document.getElementById('ws-title');
      const subEl = document.getElementById('ws-sub');
      const fxCanvas = document.getElementById('fx-canvas');
      const fxCtx = fxCanvas && fxCanvas.getContext('2d');
      let hideTimer = null;
      let particles = [];
      let particleRaf = null;

      function fitStage() {
        const stage = document.getElementById('stage');
        const sx = window.innerWidth / 1920;
        const sy = window.innerHeight / 1080;
        const s = Math.min(sx, sy) || 1;
        stage.style.transformOrigin = '0 0';
        stage.style.transform = s === 1 ? 'none' : 'scale(' + s + ')';
      }
      window.addEventListener('resize', fitStage);
      fitStage();

      function sparkBurst(intensity) {
        if (!fxCtx) return;
        const n = Math.min(180, 40 + intensity * 8);
        const cx = 960;
        const cy = 540;
        for (let i = 0; i < n; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * (4 + intensity * 0.15);
          particles.push({
            x: cx + (Math.random() - 0.5) * 200,
            y: cy + (Math.random() - 0.5) * 80,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 50 + Math.random() * 40,
            hue: 35 + Math.random() * 280,
            size: 2 + Math.random() * (intensity > 80 ? 6 : 3),
          });
        }
        if (!particleRaf) tickParticles();
      }

      function tickParticles() {
        if (!fxCtx) return;
        particleRaf = requestAnimationFrame(tickParticles);
        fxCtx.clearRect(0, 0, 1920, 1080);
        particles = particles.filter((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.06;
          p.life -= 1;
          if (p.life <= 0) return false;
          fxCtx.fillStyle = 'hsla(' + p.hue + ',95%,65%,' + Math.min(1, p.life / 30) + ')';
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          fxCtx.fill();
          return true;
        });
        if (particles.length === 0) {
          cancelAnimationFrame(particleRaf);
          particleRaf = null;
        }
      }

      function playSound(src, volume) {
        if (!src) return;
        const mediaBase = location.protocol + '//' + location.host + '/media/';
        const url = src.startsWith('http') ? src : mediaBase + encodeURI(src.replace(/^\/+/, ''));
        try {
          const audio = new Audio(url);
          audio.volume = Math.min(1, Math.max(0, (volume || 80) / 100));
          audio.play().catch(function () {});
        } catch (e) {}
      }

      function peakDelayForEffect(effect) {
        const map = { glow: 700, pulse: 900, shine: 800, flare: 1000, burst: 1100, epic: 1550, confetti: 1650 };
        return map[effect] || 900;
      }

      function showAlert(payload) {
        if (!payload) return;
        clearTimeout(hideTimer);
        root.className = '';
        root.classList.remove('hold-peak');
        const scale = payload.scale || 1;
        root.style.setProperty('--ws-scale', String(scale));
        root.style.setProperty('--ws-font-size', (payload.fontSize || 48) + 'px');
        root.style.setProperty('--ws-accent', payload.accentColor || '#ffd54f');
        root.style.setProperty('--ws-text', payload.textColor || '#ffffff');
        root.style.maxWidth = (payload.maxWidth || 900) + 'px';
        root.style.padding = payload.padding || '24px 48px';
        root.style.borderColor = payload.borderColor || 'rgba(255,255,255,0.35)';
        const bg = payload.backgroundColor || 'rgba(48, 18, 86, 0.94)';
        root.style.background = bg.includes('gradient') ? bg : bg;
        const label = root.querySelector('.ws-label');
        if (label) label.style.fontSize = (payload.labelSize || 22) + 'px';
        titleEl.style.fontSize = (payload.fontSize || 48) + 'px';
        subEl.style.fontSize = (payload.subSize || 28) + 'px';
        const effect = String(payload.effect || 'glow').toLowerCase();
        root.classList.add('effect-' + effect);
        titleEl.textContent = payload.text || '';
        subEl.textContent =
          (payload.displayName || payload.username || 'Viewer') +
          ' · ' +
          (payload.streakCount || '?') +
          ' streams';
        requestAnimationFrame(function () {
          root.classList.add('visible');
        });
        if (effect === 'epic' || effect === 'confetti' || effect === 'burst' || effect === 'flare') {
          sparkBurst(Number(payload.streakCount) || 10);
        }
        if (effect === 'confetti') sparkBurst(200);
        playSound(payload.soundFile, payload.soundVolume);
        const duration = Math.max(3000, payload.durationMs || 5000);
        hideTimer = setTimeout(function () {
          root.classList.remove('visible');
        }, duration);

        if (params.has('freeze')) {
          setTimeout(function () {
            root.classList.add('hold-peak');
          }, peakDelayForEffect(effect));
        }
      }

      window.__wsShowAlert = showAlert;

      function connect() {
        const wsUrl =
          (location.protocol === 'https:' ? 'wss:' : 'ws:') +
          '//' +
          location.host +
          '?overlay=' +
          encodeURIComponent(OVERLAY_NAME);
        const ws = new WebSocket(wsUrl);
        ws.onopen = function () {
          window.__wsConnected = true;
        };
        ws.onclose = function () {
          window.__wsConnected = false;
          setTimeout(connect, 2000);
        };
        ws.onmessage = function (ev) {
          try {
            const data = JSON.parse(ev.data);
            if (data.type === 'watchStreakAlert') showAlert(data);
          } catch (e) {}
        };
      }
      connect();
    })();
  </script>
</body>
</html>
