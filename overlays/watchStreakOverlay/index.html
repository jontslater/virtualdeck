<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Streak Alerts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #stage {
      width: 1920px;
      height: 1080px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #alert-root {
      opacity: 0;
      transform: translateY(24px) scale(0.85);
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.2, 0.9, 0.2, 1.2);
      max-width: 1200px;
      text-align: center;
      padding: 28px 48px;
      border-radius: 20px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.35) inset;
    }
    #alert-root.visible {
      opacity: 1;
      transform: translateY(0) scale(var(--ws-scale, 1));
    }
    #alert-root.effect-pulse.visible { animation: ws-pulse 1.2s ease-in-out 2; }
    #alert-root.effect-glow.visible { animation: ws-glow 2.2s ease-in-out infinite; }
    #alert-root.effect-shine.visible::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
      animation: ws-shine 1.8s ease-in-out 2;
      pointer-events: none;
    }
    #alert-root.effect-flare.visible { animation: ws-flare 2s ease-out 1; }
    #alert-root.effect-burst.visible { animation: ws-burst 2.4s ease-out 1; }
    #alert-root.effect-epic.visible {
      animation: ws-epic 3s ease-in-out 1;
      border-width: 4px;
      border-color: rgba(255, 213, 79, 0.75);
    }
    #alert-root { position: relative; }
  .ws-label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ws-accent, #ffd54f);
      text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,0.8);
      margin-bottom: 10px;
    }
    #ws-title {
      font-size: var(--ws-font-size, 48px);
      font-weight: 800;
      color: var(--ws-text, #fff);
      line-height: 1.15;
      text-shadow: 0 3px 0 #000, 0 0 18px rgba(0,0,0,0.85), 2px 2px 0 #000;
    }
    #ws-sub {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 600;
      color: #f5f5f5;
      text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,0.8);
    }
    #conn {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      text-shadow: 0 1px 2px #000;
    }
    @keyframes ws-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); transform: translateY(0) scale(calc(var(--ws-scale, 1) * 1.04)); }
    }
    @keyframes ws-glow {
      0%, 100% { box-shadow: 0 18px 48px rgba(0,0,0,0.55); }
      50% { box-shadow: 0 22px 60px rgba(255,255,255,0.22); }
    }
    @keyframes ws-shine {
      from { transform: translateX(-120%); }
      to { transform: translateX(120%); }
    }
    @keyframes ws-flare {
      0% { filter: brightness(0.6); transform: scale(0.7); opacity: 0; }
      40% { filter: brightness(1.3); opacity: 1; }
      100% { transform: scale(var(--ws-scale, 1)); }
    }
    @keyframes ws-burst {
      0% { transform: scale(0.5) rotate(-4deg); opacity: 0; }
      35% { transform: scale(calc(var(--ws-scale, 1) * 1.12)) rotate(2deg); opacity: 1; }
      100% { transform: scale(var(--ws-scale, 1)) rotate(0deg); }
    }
    @keyframes ws-epic {
      0% { transform: scale(0.35); opacity: 0; filter: blur(6px); }
      30% { opacity: 1; filter: blur(0); }
      60% { transform: scale(calc(var(--ws-scale, 1) * 1.08)); }
      100% { transform: scale(var(--ws-scale, 1)); }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="alert-root" aria-live="polite">
      <div class="ws-label">Watch streak</div>
      <div id="ws-title"></div>
      <div id="ws-sub"></div>
    </div>
  </div>
  <div id="conn">connecting…</div>
  <script>
    (function () {
      const OVERLAY_NAME = 'watchStreak';
      const root = document.getElementById('alert-root');
      const titleEl = document.getElementById('ws-title');
      const subEl = document.getElementById('ws-sub');
      const connEl = document.getElementById('conn');
      let hideTimer = null;

      function fitStage() {
        const sx = window.innerWidth / 1920;
        const sy = window.innerHeight / 1080;
        const s = Math.min(sx, sy) || 1;
        document.getElementById('stage').style.transformOrigin = '0 0';
        document.getElementById('stage').style.transform = s === 1 ? 'none' : 'scale(' + s + ')';
      }
      window.addEventListener('resize', fitStage);
      fitStage();

      function playSound(src, volume) {
        if (!src) return;
        const mediaBase = location.protocol + '//' + location.host + '/media/';
        const url = src.startsWith('http') ? src : mediaBase + encodeURI(src.replace(/^\/+/, ''));
        try {
          const audio = new Audio(url);
          audio.volume = Math.min(1, Math.max(0, (volume || 80) / 100));
          audio.play().catch(function () {});
        } catch (e) {}
      }

      function showAlert(payload) {
        if (!payload) return;
        clearTimeout(hideTimer);
        root.className = '';
        root.style.setProperty('--ws-scale', String(payload.scale || 1));
        root.style.setProperty('--ws-font-size', Math.round(38 + (payload.streakCount || 0) / 8) + 'px');
        root.style.setProperty('--ws-accent', payload.accentColor || '#ffd54f');
        root.style.setProperty('--ws-text', payload.textColor || '#ffffff');
        root.style.background = payload.backgroundColor || 'rgba(48, 18, 86, 0.92)';
        const effect = (payload.effect || 'glow').toLowerCase();
        root.classList.add('effect-' + effect);
        titleEl.textContent = payload.text || '';
        subEl.textContent =
          (payload.displayName || payload.username || 'Viewer') +
          ' · ' +
          (payload.streakCount || '?') +
          ' streams';
        requestAnimationFrame(function () {
          root.classList.add('visible');
        });
        playSound(payload.soundFile, payload.soundVolume);
        const duration = Math.max(2500, payload.durationMs || 5000);
        hideTimer = setTimeout(function () {
          root.classList.remove('visible');
        }, duration);
      }

      function connect() {
        const wsUrl =
          (location.protocol === 'https:' ? 'wss:' : 'ws:') +
          '//' +
          location.host +
          '?overlay=' +
          encodeURIComponent(OVERLAY_NAME);
        const ws = new WebSocket(wsUrl);
        ws.onopen = function () {
          connEl.textContent = 'connected';
        };
        ws.onclose = function () {
          connEl.textContent = 'reconnecting…';
          setTimeout(connect, 2000);
        };
        ws.onmessage = function (ev) {
          try {
            const data = JSON.parse(ev.data);
            if (data.type === 'watchStreakAlert') showAlert(data);
          } catch (e) {}
        };
      }
      connect();
    })();
  </script>
</body>
</html>
