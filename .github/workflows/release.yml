# Build and publish to GitHub Releases when a version tag (v*) is pushed.
#
# HOW TO RELEASE (do this when pushing a new version):
#   1. Bump "version" in package.json (e.g. 1.1.4 -> 1.1.5).
#   2. Commit: git add package.json && git commit -m "Bump version to X.Y.Z for release"
#   3. Create tag: git tag vX.Y.Z   (must match package.json version, e.g. v1.1.5)
#   4. Push branch: git push origin production
#   5. Push tag (this triggers the workflow): git push origin vX.Y.Z
# The workflow runs only on tag push — pushing the branch alone will not run it.
#
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (no publish)
        run: npm run build:win -- --publish never

      - name: Generate latest.yml
        run: node scripts/generate-latest-yml.js

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VirtualDeck ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          draft: false
