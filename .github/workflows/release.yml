# Build and publish to GitHub Releases when a version tag (v*) is pushed.
# Use the production branch for live releases: merge to production, then tag and push from there.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe dist/*.yml dist/*.blockmap
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
